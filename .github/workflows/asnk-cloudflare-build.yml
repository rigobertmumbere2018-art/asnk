name: ASNK Cloudflare build and deploy

on:
  push:
    branches:
      - cloudflare-ready
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build, validate and deploy ASNK Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Build and validate ASNK for Cloudflare
        run: bash cloudflare-build.sh

      - name: Publish the real ASNK application Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for deployment."
            exit 1
          fi
          npx wrangler deploy --config dist/server/wrangler.json

      - name: Verify deployed Cloudflare Worker routes
        if: github.event_name != 'pull_request'
        run: |
          set -e
          BASE="https://asnk-scouts-nord-kivu.rigobertmumbere2018.workers.dev"
          for path in / /actualites /evenements /galerie /mouvement /contact; do
            code=$(curl -sS -o /tmp/asnk-response -w "%{http_code}" "$BASE$path")
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done
