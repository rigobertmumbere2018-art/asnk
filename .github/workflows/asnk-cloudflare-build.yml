name: ASNK Cloudflare build and deploy

on:
  push:
    branches:
      - cloudflare-ready
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build, validate and deploy ASNK Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Build and validate ASNK for Cloudflare
        run: bash cloudflare-build.sh

      - name: Preserve build output for deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asnk-cloudflare-build-output
          path: |
            dist/server/
            dist/client/
            wrangler.jsonc
          if-no-files-found: warn
          retention-days: 3

      - name: Show generated Worker configuration (non-sensitive)
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const p = "dist/server/wrangler.json";
          if (!fs.existsSync(p)) {
            console.log("Generated Wrangler config not found:", p);
            process.exit(0);
          }
          const c = JSON.parse(fs.readFileSync(p, "utf8"));
          for (const k of ["name", "main", "compatibility_date", "compatibility_flags", "assets", "legacy_env", "workers_dev", "routes", "services", "r2_buckets", "d1_databases"]) {
            if (c[k] !== undefined) console.log(k + ":", JSON.stringify(c[k]));
          }
          NODE

      - name: Publish the real ASNK application Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for deployment."
            exit 1
          fi
          npx wrangler deploy --config dist/server/wrangler.json

      - name: Verify deployed Cloudflare Worker routes
        if: github.event_name != 'pull_request'
        run: |
          set -e
          BASE="https://asnk-scouts-nord-kivu.rigobertmumbere2018.workers.dev"
          for path in / /actualites /evenements /galerie /mouvement /contact; do
            code=$(curl -sS -o /tmp/asnk-response -w "%{http_code}" "$BASE$path")
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done
