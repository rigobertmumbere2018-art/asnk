name: Validate ASNK build

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.ts"
      - "wrangler.toml"
      - "Kivu Scouts Hub.zip"
      - ".github/workflows/validate-asnk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install
      - name: Build Cloudflare application
        run: npm run build
