name: Validate ASNK build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.ts"
      - "wrangler.toml"
      - "Kivu Scouts Hub.zip"
      - ".github/workflows/validate-asnk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm install
      - run: npm run build
