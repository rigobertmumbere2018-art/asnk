name: ASNK native Cloudflare Worker

on:
  push:
    branches:
      - asnk-recovery-work-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build production Worker
        run: npm run build

      - name: Validate Worker package without publishing
        run: npx wrangler deploy --config .output/server/wrangler.json --dry-run

      - name: Preserve build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asnk-native-worker-build
          path: |
            .output/server/
            .output/public/
          if-no-files-found: error
          retention-days: 7

      - name: Publish real ASNK Worker
        if: github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3453b4d54fc81067b4cc62eb7c117739"
        run: npx wrangler deploy --config .output/server/wrangler.json

      - name: Explain deployment prerequisite
        if: github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::Build and dry-run passed, but production publish was skipped."
          echo "::notice::Add CLOUDFLARE_API_TOKEN to GitHub repository Actions secrets, then run this workflow manually."
